    <h1>It will show the degital clock in the box</h1>
    <span class="box"></span>


    <script>
        const span = document.querySelector(".box")
         
        // console.log(date);
        setInterval(function(){
            const date = new Date()
            span.innerHTML = date.toLocaleTimeString();
        },1000)
        
        
    </script>
